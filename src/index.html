<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' blob: data:" />
<title>Preview Pro</title>
<style>
  :root { font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Inter, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #221824 0%, #33203a 55%, #4a2850 100%);
    color: #f3eaf0; font-size: 12px; user-select: none;
  }
  #app { height: 100%; display: flex; flex-direction: column; background: rgba(58,42,58,.55); }
  #titlebar {
    height: 38px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.06); border-bottom: 1px solid rgba(255,255,255,.06);
    -webkit-app-region: drag;
  }
  #titlebar h1 { font-size: 13px; font-weight: 600; margin: 0; }

  #tabs { display: flex; gap: 6px; padding: 8px 14px 0; flex-shrink: 0; overflow-x: auto; }
  .tab {
    display: flex; align-items: center; gap: 7px; font-size: 12px; padding: 6px 14px; white-space: nowrap;
    background: rgba(255,255,255,.05); border-radius: 8px 8px 0 0; color: #cbb6c2;
    border: 1px solid transparent; border-bottom: none; cursor: default; max-width: 240px;
  }
  .tab.sel { background: rgba(224,123,166,.22); color: #f6dbe7; border-color: rgba(224,123,166,.35); }
  .tab .doc { width: 13px; height: 13px; border-radius: 2px; background: #b08a9e; flex-shrink: 0; }
  .tab .name { overflow: hidden; text-overflow: ellipsis; }
  .tab .dot { color: #e07ba6; font-size: 9px; }
  .tab .x { color: #8f6f80; font-size: 11px; margin-left: 4px; }
  .tab .x:hover { color: #f6dbe7; }
  .tab.plus { background: transparent; color: #b08a9e; }

  #toolbar {
    display: flex; align-items: center; gap: 6px; padding: 8px 14px; flex-shrink: 0;
    background: rgba(255,255,255,.05); border-bottom: 1px solid rgba(255,255,255,.07);
  }
  .group { display: flex; gap: 4px; align-items: center; }
  .sep { width: 1px; height: 20px; background: rgba(255,255,255,.12); margin: 0 6px; }
  .tb {
    display: flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 7px;
    color: #e9d9e3; background: rgba(255,255,255,.05); border: 1px solid transparent; white-space: nowrap; cursor: default;
  }
  .tb:hover { background: rgba(255,255,255,.1); }
  .tb svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.5; flex-shrink: 0; }
  .tb.primary { background: #e07ba6; color: #2e1622; font-weight: 600; }
  .tb.ctx { border: 1px dashed rgba(224,123,166,.6); color: #f0b9d2; }
  .tb.ctx.on { background: rgba(224,123,166,.28); border-style: solid; color: #fff; }
  .spacer { flex: 1; }
  #q { background: rgba(0,0,0,.25); color: #f3eaf0; border: none; outline: none; font: inherit; width: 230px; padding: 0; user-select: text; }
  #q::placeholder { color: #b08a9e; }

  #main { flex: 1; display: flex; min-height: 0; }
  #side {
    width: 240px; flex-shrink: 0; border-right: 1px solid rgba(255,255,255,.07);
    padding: 12px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
  }
  #side.hide { display: none; }
  #side h4 { margin: 0 0 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: #c197a9; }
  .qa, .nav { display: flex; flex-direction: column; gap: 5px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; background: rgba(255,255,255,.04); color: #e9d9e3; cursor: default; }
  .row:hover { background: rgba(255,255,255,.09); }
  .row.sub { padding-left: 22px; color: #b08a9e; }
  .row .g { color: #e07ba6; width: 14px; text-align: center; }
  .row input { width: 44px; background: rgba(0,0,0,.25); border: none; color: inherit; font: inherit; border-radius: 4px; padding: 2px 4px; text-align: center; outline: none; }
  .hit .p { color: #e07ba6; font-weight: 600; flex-shrink: 0; }
  .hit span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .versions { font-size: 11px; color: #b08a9e; }
  .v { display: flex; justify-content: space-between; gap: 8px; padding: 4px 8px; border-radius: 6px; cursor: default; }
  .v:hover { background: rgba(255,255,255,.07); }
  .muted { color: #8f6f80; font-size: 11px; }

  #canvas {
    flex: 1; position: relative; overflow: auto;
    background: radial-gradient(circle at 40% 30%, rgba(224,123,166,.10), transparent 60%), #1c1420;
  }
  #pages { padding: 24px; min-width: min-content; }
  .page { position: relative; background: #fff; margin: 0 auto 18px; box-shadow: 0 10px 30px rgba(0,0,0,.5); border-radius: 3px; overflow: hidden; width: fit-content; }
  .page canvas, .page > img { display: block; width: 100%; height: 100%; -webkit-user-drag: none; }
  .textLayer { position: absolute; inset: 0; overflow: hidden; line-height: 1; user-select: text; }
  .textLayer :is(span, br) { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0 0; }
  .textLayer ::selection { background: rgba(224,123,166,.4); }
  .page svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #pages.t-pen .textLayer, #pages.t-sign .textLayer, #pages.t-redact .textLayer { pointer-events: none; }
  #pages.t-pen svg, #pages.t-sign svg, #pages.t-redact svg { pointer-events: auto; cursor: crosshair; }

  #empty { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; color: #b08a9e; }
  #empty[hidden] { display: none; }
  #empty b { color: #f6dbe7; font-size: 15px; }
  #empty button { margin-top: 6px; }

  #pop {
    position: fixed; z-index: 20; background: #2e1622; color: #f6dbe7; padding: 8px 10px; border-radius: 10px;
    border: 1px solid rgba(224,123,166,.5); display: flex; gap: 8px; align-items: center; font-size: 11.5px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  #pop[hidden] { display: none; }
  #pop span { background: rgba(224,123,166,.25); padding: 3px 8px; border-radius: 5px; cursor: default; }
  #pop span:hover { background: rgba(224,123,166,.5); }
  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #2e1622; color: #f6dbe7;
    border: 1px solid rgba(224,123,166,.5); padding: 8px 14px; border-radius: 9px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30;
  }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar"><h1 id="title">Preview Pro</h1></div>
  <div id="tabs"></div>

  <div id="toolbar">
    <div class="group">
      <button class="tb" id="bSide"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M6.5 3v10"/></svg>Sidebar</button>
      <button class="tb" id="bOut">−</button>
      <button class="tb" id="bIn">+</button>
      <button class="tb" id="bFit">Fit</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button class="tb ctx on" data-tool="select">Select</button>
      <button class="tb ctx" data-tool="pen"><svg viewBox="0 0 16 16"><path d="M2 13.5L13.5 2"/><path d="M2 13.5l.5-3.5 3 3z" fill="currentColor"/></svg>Markup</button>
      <button class="tb ctx" data-tool="hl"><svg viewBox="0 0 16 16"><path d="M4 12l1-3 6-6 2 2-6 6z"/><path d="M3 14.5h10" stroke-width="3"/></svg>Highlight</button>
      <button class="tb ctx" data-tool="redact"><svg viewBox="0 0 16 16"><rect x="2" y="4" width="12" height="8" rx="1.5"/><path d="M4 6h8v4H4z" fill="currentColor"/></svg>Redact</button>
      <button class="tb ctx" data-tool="sign"><svg viewBox="0 0 16 16"><path d="M2 10c2-1 3-4 4.5-4.5S8 9 9.5 9.5 12 6 14 6"/><path d="M2 13h12"/></svg>Sign</button>
    </div>
    <div class="sep"></div>
    <div class="group"><button class="tb primary" id="bQA">⚡ Quick Actions</button></div>
    <div class="spacer"></div>
    <label class="tb"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><input id="q" placeholder="Search text…" /></label>
  </div>

  <div id="main">
    <aside id="side"></aside>
    <div id="canvas">
      <div id="pages"></div>
      <div id="empty"><b>Drop PDFs or images here</b><span>Open as many as you like — each gets its own tab</span><button class="tb primary" id="bOpen">Open files…</button></div>
    </div>
  </div>
</div>
<div id="pop" hidden><span data-s="hl">Highlight</span><span data-s="rd">Redact</span><span data-s="copy">Copy text</span></div>
<div id="toast"></div>
<script src="../node_modules/pdf-lib/dist/pdf-lib.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
